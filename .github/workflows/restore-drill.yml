name: Supabase Restore Drill

on:
  schedule:
    - cron: "31 3 1 * *"
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Uğurlu Supabase Backup workflow run ID"
        required: false
      confirmation:
        description: "Bərpa sınağını təsdiqləmək üçün RESTORE yazın"
        required: false

permissions:
  actions: read
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Safety gate
        env:
          RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${{ github.event_name }}" = "schedule" || test "$RESTORE_CONFIRMATION" = "RESTORE" || (echo "confirmation == 'RESTORE' tələb olunur" && exit 1)
          test -n "$RESTORE_DATABASE_URL" || (echo "RESTORE_DATABASE_URL yoxdur" && exit 1)
          test "$RESTORE_DATABASE_URL" != "$SUPABASE_DB_URL" || (echo "Refuse production as restore target" && exit 1)
      - name: Download selected backup
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          RUN_ID="$REQUESTED_BACKUP_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow backup-supabase.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID" || (echo "Uğurlu backup tapılmadı" && exit 1)
          gh run download "$RUN_ID" --name "supabase-backup-$RUN_ID" --dir backup
      - name: Verify checksum
        run: (cd backup && sha256sum --check SHA256SUMS)
      - name: Restore into isolated target
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop schema if exists public cascade; create schema public;"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -f backup/schema.sql
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_DATABASE_URL" backup/data.dump
      - name: Validate restored database
        run: |
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from public.tenants;"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select 'RESTORE_OK' as status;"

