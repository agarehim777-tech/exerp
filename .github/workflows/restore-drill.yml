name: Supabase Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Uğurlu Supabase Backup workflow run ID"
        required: true
      confirmation:
        description: "Bərpa sınağını təsdiqləmək üçün RESTORE yazın"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESTORE_PROJECT_REF: ${{ vars.RESTORE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Safety gate before any database access
        env:
          RESTORE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/restore-target-guard.mjs
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Configure disposable database connection
        run: |
          RESTORE_DB_PASSWORD="$(node -e "const u=new URL(process.env.RESTORE_DATABASE_URL); process.stdout.write(decodeURIComponent(u.password))")"
          test -n "$RESTORE_DB_PASSWORD" || (echo "RESTORE_DATABASE_URL parolu yoxdur" && exit 1)
          echo "::add-mask::$RESTORE_DB_PASSWORD"
          {
            node -e 'const u=new URL(process.env.RESTORE_DATABASE_URL); for(const [k,v] of Object.entries({PGHOST:u.hostname,PGPORT:u.port||"5432",PGDATABASE:u.pathname.slice(1)||"postgres",PGUSER:decodeURIComponent(u.username)}))console.log(`${k}=${v}`)'
            echo "PGPASSWORD=$RESTORE_DB_PASSWORD"
            echo "PGSSLMODE=require"
            echo "PGCONNECT_TIMEOUT=10"
          } >> "$GITHUB_ENV"
      - name: Download selected backup
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          RUN_ID="$REQUESTED_BACKUP_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow backup-supabase.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID" || (echo "Uğurlu backup tapılmadı" && exit 1)
          gh run download "$RUN_ID" --name "supabase-backup-$RUN_ID" --dir backup
      - name: Verify checksum
        run: (cd backup && sha256sum --check SHA256SUMS)
      - name: Wait for disposable database
        run: |
          for attempt in $(seq 1 15); do
            if psql -v ON_ERROR_STOP=1 -c "select 1;" > /dev/null 2>&1; then
              echo "Disposable database is ready."
              exit 0
            fi
            echo "Disposable database is not ready (attempt $attempt/15)."
            sleep 20
          done
          echo "Disposable database remained unavailable for 5 minutes."
          exit 1
      - name: Restore into isolated target
        run: |
          test -s backup/application.dump || (echo "Backup has no atomic application archive; refuse legacy destructive restore" && exit 1)
          pg_restore --list backup/application.dump > backup/application.toc
          pg_restore --clean --if-exists --single-transaction --exit-on-error --no-owner --no-privileges --dbname=postgres backup/application.dump
      - name: Validate restored database
        run: |
          psql -v ON_ERROR_STOP=1 -c "select count(*) from public.tenants;"
          psql -v ON_ERROR_STOP=1 -c "select 'RESTORE_OK' as status;"

