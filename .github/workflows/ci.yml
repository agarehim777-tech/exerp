name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & build
    environment: staging
    runs-on: ubuntu-latest
    env:
      E2E_TENANT_ID: ${{ vars.E2E_TENANT_ID }}
      E2E_OTHER_TENANT_ID: ${{ vars.E2E_OTHER_TENANT_ID }}
      E2E_SUPABASE_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Require authenticated E2E account
        run: |
          test -n "$E2E_TEST_USER"
          test -n "$E2E_TEST_PASS"
          node scripts/verify-e2e-target.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASS: ${{ secrets.E2E_TEST_PASS }}

      - name: Release gates
        run: npm run verify:release
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and tenant-isolation tests
        run: npm run e2e -- --grep-invert "@lifecycle|@ai"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.LOVABLE_BROWSER_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.LOVABLE_BROWSER_SUPABASE_SESSION_JSON }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASS: ${{ secrets.E2E_TEST_PASS }}

      - name: Authenticated AI tool-call test
        if: ${{ vars.AI_E2E_ENABLED == 'true' }}
        run: npm run e2e -- tests/ai-assistant.spec.ts --workers=1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASS: ${{ secrets.E2E_TEST_PASS }}
          AI_E2E_ENABLED: "true"

      - name: Sales and expense lifecycle tests
        run: npm run e2e:lifecycle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASS: ${{ secrets.E2E_TEST_PASS }}

      - name: All 21 business lifecycle flows
        id: business_flows
        run: npm run audit:flows
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_TEST_USER }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_TEST_PASS }}
          AUDIT_FLOW_TIMEOUT_MS: 90000

      - name: Upload business lifecycle evidence
        if: ${{ always() && steps.business_flows.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: business-flow-audit
          path: test-results/business-flow-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results
          retention-days: 5

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

