name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never connects to a Supabase project. The second project is the backup database (restore
# target), not a test database, and production must never receive test data. Every gate below runs
# offline: database behaviour is covered by the PGlite SQL tests in `npm test`, which replay
# supabase/migrations.
jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Release gates
        id: release_gates
        run: npm run verify:release:offline
        env:
          # Placeholder values: the build needs them, nothing connects to them.
          VITE_SUPABASE_URL: https://offline-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: offline-ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive module layout regression tests
        run: npx playwright test --config tests/layout.playwright.config.ts

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: test-results
          retention-days: 5

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 5

  # Database-backed checks against a throwaway local Supabase built from supabase/migrations inside
  # this job. It never reaches a hosted project (the seed script refuses non-local URLs) and is
  # deleted with the runner. A failure here fails CI: every browser, lifecycle and business-flow
  # check must pass against the schema built from this repo.
  local-database:
    name: Local Supabase E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@v2
        with:
          # 2.39.2 mis-split a plpgsql body in 20260812090000; 3.1.0 applies all migrations.
          version: 3.1.0

      - name: Start local Supabase and apply every migration
        run: supabase start -x studio,imgproxy,vector,logflare,postgres-meta,supavisor

      - name: Export local Supabase endpoints
        run: supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"

      - name: Seed E2E users and tenants, then check tenant isolation
        run: node scripts/local-e2e-seed.mjs

      - name: E2E target guard accepts only this local database
        run: node scripts/verify-e2e-target.mjs

      - name: Core backend contract (tables and RPCs the app needs)
        run: npm run verify:core-backend

      # plpgsql only checks a statement when it runs, so a function writing a dropped column passes every
      # migration and fails in production (delete_sales_order_safe, complete_inventory_return). The
      # linter (plpgsql_check) finds those statically.
      - name: Database function lint (plpgsql_check)
        run: supabase db lint --local --level error --fail-on error

      - name: Install Playwright Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: Provision restricted audit identity (local)
        id: readonly_identity
        if: ${{ !cancelled() }}
        run: node scripts/provision-readonly-audit.mjs

      - name: Restricted identity authorization gate (local)
        if: ${{ !cancelled() && steps.readonly_identity.outcome == 'success' }}
        run: node scripts/verify-readonly-audit.mjs

      - name: Browser and tenant-isolation tests (local)
        if: ${{ !cancelled() }}
        run: npm run e2e -- --grep-invert "@lifecycle|@ai" --output=test-results/browser

      - name: Sales and expense lifecycle tests (local)
        if: ${{ !cancelled() }}
        run: npm run e2e:lifecycle -- --output=test-results/sales-expense

      - name: Concurrent server lifecycle tests (local)
        if: ${{ !cancelled() }}
        run: npm run e2e -- tests/concurrent-lifecycle.spec.ts --workers=1 --output=test-results/concurrency

      - name: Credit deposit lifecycle (local)
        if: ${{ !cancelled() }}
        run: npm run e2e -- tests/credit-deposit-lifecycle.spec.ts --workers=1 --output=test-results/credit-deposit

      - name: Delivery and reversal lifecycle matrix (local)
        if: ${{ !cancelled() }}
        run: npm run e2e -- tests/delivery-reversal-lifecycle.spec.ts --workers=1 --output=test-results/delivery-reversal

      - name: Build the app for the business-flow audit (local)
        if: ${{ !cancelled() }}
        run: npm run build

      - name: 20 required business flows (local)
        id: business_flows
        if: ${{ !cancelled() }}
        run: npm run audit:flows
        env:
          E2E_USER_EMAIL: ${{ env.E2E_TEST_USER }}
          E2E_USER_PASSWORD: ${{ env.E2E_TEST_PASS }}
          AUDIT_FLOW_TIMEOUT_MS: 150000
          AUDIT_DEFER_NOTIFICATION_PROVIDER: "true"

      - name: Upload local E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: local-e2e-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
