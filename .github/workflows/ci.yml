name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never connects to a Supabase project. The second project is the backup database (restore
# target), not a test database, and production must never receive test data. Every gate below runs
# offline: database behaviour is covered by the PGlite SQL tests in `npm test`, which replay
# supabase/migrations.
jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Release gates
        id: release_gates
        run: npm run verify:release:offline
        env:
          # Placeholder values: the build needs them, nothing connects to them.
          VITE_SUPABASE_URL: https://offline-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: offline-ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive module layout regression tests
        run: npx playwright test --config tests/layout.playwright.config.ts

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results
          retention-days: 5

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
