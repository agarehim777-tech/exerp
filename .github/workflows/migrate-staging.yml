name: Migrate Staging Database

# Staging counterpart of "Migrate Production Database". `db push --include-all` applies every
# migration missing from the staging migration history, so run `plan` first and read the list.
# It connects straight to the database through the session pooler, so the Management API token
# needs no extra permissions. The connection string is built from SUPABASE_DB_PASSWORD and the
# pooler host (scripts/staging-db-url.mjs), which encodes the password for the URL.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (dry run, lists pending migrations) or apply"
        type: choice
        options: [plan, apply]
        default: plan
      confirmation:
        description: "apply only: type MIGRATE STAGING"
        required: false

permissions:
  contents: read

jobs:
  migrate:
    environment: staging
    # Never change the schema while an audit run is using the staging tenant.
    concurrency:
      group: staging-audit-tenant
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_PROJECT_REF: ${{ vars.E2E_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build staging database URL
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STAGING_DB_POOLER_HOST: ${{ vars.STAGING_DB_POOLER_HOST || 'aws-0-ap-northeast-1.pooler.supabase.com' }}
        run: node scripts/staging-db-url.mjs
      - name: Staging-only safety gate
        env:
          MODE: ${{ inputs.mode }}
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$STAGING_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || { echo "E2E_SUPABASE_PROJECT_REF is not a project ref"; exit 1; }
          [ "$STAGING_PROJECT_REF" != "tcqdhwtnjrwpfdxoijmv" ] || { echo "Refusing to migrate production from the staging workflow"; exit 1; }
          [ -n "$STAGING_DB_URL" ] || { echo "The staging database URL was not built"; exit 1; }
          [[ "$STAGING_DB_URL" == *"$STAGING_PROJECT_REF"* ]] || { echo "STAGING_DB_URL does not point at the staging project"; exit 1; }
          [[ "$STAGING_DB_URL" != *tcqdhwtnjrwpfdxoijmv* ]] || { echo "STAGING_DB_URL points at production"; exit 1; }
          if [ "$MODE" = "apply" ]; then test "$MIGRATION_CONFIRMATION" = "MIGRATE STAGING"; fi
      - name: Lint staging schema
        run: npx --yes supabase@2.39.2 db lint --db-url "$STAGING_DB_URL" --level error
      - name: List pending migrations (dry run)
        run: npx --yes supabase@2.39.2 db push --db-url "$STAGING_DB_URL" --include-all --dry-run
      - name: Apply ordered migrations
        if: ${{ inputs.mode == 'apply' }}
        run: npx --yes supabase@2.39.2 db push --db-url "$STAGING_DB_URL" --include-all
