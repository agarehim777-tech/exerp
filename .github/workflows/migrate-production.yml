name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Production migration üçün MIGRATE yazın"
        required: true

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Explicit production safety gate
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$MIGRATION_CONFIRMATION" = "MIGRATE"
      - name: Require database credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Link and lint production schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase@2.39.2 link --project-ref tcqdhwtnjrwpfdxoijmv --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.39.2 db lint --linked --level error
      - name: Apply ordered migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes supabase@2.39.2 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
