name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: yalnız tətbiq olunacaq migration-ları göstər (dəyişiklik yoxdur). apply: tətbiq et."
        type: choice
        options: [plan, apply]
        default: plan
      confirmation:
        description: "Yalnız apply üçün: MIGRATE yazın"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Explicit production safety gate (apply only)
        if: inputs.mode == 'apply'
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$MIGRATION_CONFIRMATION" = "MIGRATE"
      # GitHub runners have no IPv6, so the CLI's direct `link` connection fails; every command uses the
      # IPv4 session pooler (the same host as the nightly backup) through --db-url instead.
      - name: Build the pooler connection string
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/production-db-url.mjs
      - name: Lint production schema
        run: npx --yes supabase@3.1.0 db lint --db-url "$PRODUCTION_DB_URL" --level error
      # Plan runs in both modes with the same flags as apply, so the log shows exactly what apply does.
      - name: Plan (migration history and dry run, no changes)
        run: |
          npx --yes supabase@3.1.0 migration list --db-url "$PRODUCTION_DB_URL"
          npx --yes supabase@3.1.0 db push --db-url "$PRODUCTION_DB_URL" --include-all --dry-run
      # The CLI asks before applying and cannot prompt in CI ("Nothing was changed", run 43565675512);
      # --yes answers it. The MIGRATE gate above is the human confirmation.
      - name: Apply ordered migrations
        if: inputs.mode == 'apply'
        run: npx --yes supabase@3.1.0 db push --db-url "$PRODUCTION_DB_URL" --include-all --yes
