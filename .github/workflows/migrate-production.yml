name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan: yalnız tətbiq olunacaq migration-ları göstər (dəyişiklik yoxdur). apply: tətbiq et."
        type: choice
        options: [plan, apply]
        default: plan
      confirmation:
        description: "Yalnız apply üçün: MIGRATE yazın"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Explicit production safety gate (apply only)
        if: inputs.mode == 'apply'
        env:
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$MIGRATION_CONFIRMATION" = "MIGRATE"
      - name: Require database credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Link and lint production schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase@3.1.0 link --project-ref tcqdhwtnjrwpfdxoijmv --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@3.1.0 db lint --linked --level error
      # Plan runs in both modes with the same flags as apply, so the log shows exactly what apply does.
      - name: Plan (migration history and dry run, no changes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase@3.1.0 migration list --linked --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@3.1.0 db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply ordered migrations
        if: inputs.mode == 'apply'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes supabase@3.1.0 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
