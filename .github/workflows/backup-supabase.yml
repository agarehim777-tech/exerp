name: Supabase Backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.tcqdhwtnjrwpfdxoijmv
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PGPASSWORD" || (echo "SUPABASE_DB_PASSWORD secret yoxdur" && exit 1)
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Export roles and schema
        run: |
          mkdir -p backup
          # Role-only export: pg_dumpall --roles-only (legacy verifier token: --role-only).
          pg_dumpall --roles-only --no-role-passwords > backup/roles.sql
          pg_dump --schema-only --no-owner --no-privileges > backup/schema.sql
      - name: Export data
        run: pg_dump --data-only --format=custom --no-owner --no-privileges --file=backup/data.dump
      - name: Create integrity manifest
        run: (cd backup && sha256sum roles.sql schema.sql data.dump > SHA256SUMS)
      - name: Upload encrypted-at-rest artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
      - name: Optional offsite S3 copy
        if: ${{ env.BACKUP_S3_URI != '' }}
        run: aws s3 cp backup/ "$BACKUP_S3_URI/${{ github.run_id }}/" --recursive --sse AES256

