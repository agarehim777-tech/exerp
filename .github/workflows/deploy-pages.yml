name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://tcqdhwtnjrwpfdxoijmv.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and business-rule tests
        run: npm test

      - name: Migration gate
        run: npm run verify:migrations

      - name: Security gate
        run: npm run verify:security

      - name: Transaction lifecycle gate
        run: npm run verify:hardening

      - name: Backend contract gate
        run: npm run verify:core-backend

      - name: Apply Supabase migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          POOLER_URL="$(node -e 'const u = new URL(process.env.SUPABASE_DB_URL); u.username = "postgres.tcqdhwtnjrwpfdxoijmv"; u.hostname = "aws-0-ap-southeast-1.pooler.supabase.com"; u.port = "5432"; process.stdout.write(u.toString())')"
          for migration in \
            supabase/migrations/20260901153000_complete_sales_reversal_lifecycle.sql \
            supabase/migrations/20260901170000_make_sales_reversal_schema_compatible.sql \
            supabase/migrations/20260901183000_reconcile_cancelled_sales_orders.sql \
            supabase/migrations/20260901184500_enforce_cancelled_order_credit_invariants.sql \
            supabase/migrations/20260903120000_operational_control_center.sql; do
            psql "$POOLER_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Build
        run: npm run build:pages

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
