name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://tcqdhwtnjrwpfdxoijmv.supabase.co
  VITE_SUPABASE_PROJECT_ID: tcqdhwtnjrwpfdxoijmv
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  TEST_USER: ${{ secrets.E2E_TEST_USER }}
  TEST_PASS: ${{ secrets.E2E_TEST_PASS }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and business-rule tests
        run: npm test

      - name: Migration gate
        run: npm run verify:migrations

      - name: Security gate
        run: npm run verify:security

      - name: Transaction lifecycle gate
        run: npm run verify:hardening

      - name: Supabase contract gate
        run: npm run verify:core-backend

      - name: Require isolated lifecycle credentials
        run: test -n "$TEST_USER" -a -n "$TEST_PASS" || (echo "E2E_TEST_USER/E2E_TEST_PASS secrets tələb olunur" && exit 1)

      - name: Stock, credit and payment lifecycle gates
        run: |
          npm run verify:stock
          npm run verify:credit
          npm run verify:credit-payments

      - name: Build
        run: npm run build:pages

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
