name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test-project

      - name: Deployment checks
        run: npm run verify:deploy

      - name: Security checks
        run: npm run verify:security

      - name: Transaction and tenant hardening checks
        run: npm run verify:hardening

      - name: Backup and restore checks
        run: npm run verify:recovery

      - name: Validate production backend config
        shell: bash
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "VITE_SUPABASE_PUBLISHABLE_KEY is missing" && exit 1)

      - name: Build
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: https://tcqdhwtnjrwpfdxoijmv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: tcqdhwtnjrwpfdxoijmv
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_RELEASE_VERSION: ${{ github.sha }}

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy health check
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --location --output /tmp/exerp.html --write-out '%{http_code}' "$SITE_URL")"
            if [[ "$code" == "200" ]] && grep -q '<div id="root"' /tmp/exerp.html; then
              echo "Production health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP $code"
            sleep 10
          done
          echo "Production health check failed"
          exit 1
