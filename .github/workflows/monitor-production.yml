name: Monitor production

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SITE_URL: https://agarehim777-tech.github.io/exerp/
      SUPABASE_HEALTH_URL: https://tcqdhwtnjrwpfdxoijmv.supabase.co/auth/v1/health
    steps:
      - name: Check frontend and backend health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p monitor
          checked_at="$(date -u +%FT%TZ)"
          frontend_code="$(curl --silent --show-error --location --max-time 20 --output monitor/frontend.html --write-out '%{http_code}' "$SITE_URL")"
          backend_code="$(curl --silent --show-error --max-time 20 --output monitor/backend.json --write-out '%{http_code}' "$SUPABASE_HEALTH_URL")"
          printf '{"checked_at":"%s","frontend":%s,"backend":%s}\n' "$checked_at" "$frontend_code" "$backend_code" | tee monitor/result.json
          test "$frontend_code" = "200"
          grep -q '<div id="root"' monitor/frontend.html
          [[ "$backend_code" =~ ^2[0-9][0-9]$ ]]

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: monitor/
          retention-days: 7
