services:
  - type: web
    name: exerp-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_RELEASE_VERSION
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
